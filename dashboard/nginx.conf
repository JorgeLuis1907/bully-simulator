server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/node1/ {
        set $up node-1;
        proxy_pass http://$up:8080/bully/;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/node2/ {
        set $up node-2;
        proxy_pass http://$up:8080/bully/;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/node3/ {
        set $up node-3;
        proxy_pass http://$up:8080/bully/;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/node4/ {
        set $up node-4;
        proxy_pass http://$up:8080/bully/;
        add_header Access-Control-Allow-Origin *;
    }
    location /api/node5/ {
        set $up node-5;
        proxy_pass http://$up:8080/bully/;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}